name: Refresh Jobs

on:
  schedule:
    # Runs every day at 06:00 UTC (2 AM Eastern / 11 PM Pacific)
    - cron: "0 6 * * *"
  workflow_dispatch:   # allows manual trigger from GitHub UI

permissions:
  contents: write      # needed to commit jobs.json back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job aggregator
        run: python fetch_jobs.py

      - name: Commit updated jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          # Only commit if the file actually changed
          git diff --cached --quiet || git commit -m "chore: refresh jobs.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
